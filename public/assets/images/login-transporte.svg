<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Caminhão boiadeiro na estrada">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00184d"/>
      <stop offset=".5" stop-color="#1558c0"/>
      <stop offset="1" stop-color="#f9b27a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1000" fill="url(#ceu)"/>
  <circle cx="690" cy="540" r="105" fill="#fde7b0" opacity=".92"/>
  <circle cx="690" cy="540" r="150" fill="#fde7b0" opacity=".15"/>

  <!-- colinas -->
  <path d="M0 650 C150 570 300 610 450 585 C600 560 760 615 900 575 V1000 H0Z" fill="#0a3d99"/>
  <path d="M0 730 C200 660 350 705 520 676 C700 646 800 706 900 686 V1000 H0Z" fill="#062a6b"/>

  <!-- cerca -->
  <g stroke="#041f55" stroke-width="5" stroke-linecap="round">
    <path d="M0 770 H900"/><path d="M0 790 H900"/>
    <path d="M60 760 V800M200 760 V800M340 760 V800M480 760 V800M620 760 V800M760 760 V800M880 760 V800"/>
  </g>

  <!-- estrada -->
  <rect y="810" width="900" height="190" fill="#27322c"/>
  <path d="M0 905 H900" stroke="#f3efe2" stroke-width="6" stroke-dasharray="52 40"/>

  <!-- marcador de localização -->
  <g transform="translate(130 150)">
    <path d="M45 0C20 0 0 20 0 45c0 34 45 70 45 70s45-36 45-70C90 20 70 0 45 0z" fill="#ffffff" opacity=".95"/>
    <circle cx="45" cy="45" r="16" fill="#1f6b43"/>
  </g>
  <path d="M190 280 C260 360 380 330 450 400" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".8"/>

  <!-- caminhão boiadeiro -->
